name: CI/CD

on:
  push:
    branches: [main]
      - 'haproxy/**'
      - 'k8s/**'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: APP_VERSION=${{ github.sha }}

  deploy:
    needs: build
    runs-on: self-hosted   # Runner läuft auf k3s-loadbalancing-node-a
    steps:
      - name: Neues Image ausrollen
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::7}"
          kubectl set image deployment/web-demo whoami=$IMAGE
          kubectl rollout status deployment/web-demo --timeout=120s
          