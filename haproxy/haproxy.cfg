# /etc/haproxy/haproxy.cfg auf k3s-loadbalancing-traffic-manager
#
# Rolle: Loadbalancer (Layer 7, HTTP). Er nimmt Anfragen entgegen und verteilt sie
# auf die NodePorts der beiden k3s-Nodes. Dahinter liegt je ein Pod.

global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy         # Sicherheit: Prozess sieht nur dieses Verzeichnis
    user haproxy                    # Sicherheit: läuft nicht als root
    group haproxy
    daemon
    # Admin-Socket: Status abfragen, z. B. mit "echo 'show stat' | socat stdio /var/run/haproxy/admin.sock"
    stats socket /var/run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s

defaults
    log     global
    mode    http                    # Layer 7: HAProxy versteht HTTP (Pfade, Header, Statuscodes)
    option  httplog
    option  dontlognull

    # Zeitlimits: Sie bestimmen, wie lange ein toter Server Nutzer ausbremst.
    timeout connect 2s              # max. Wartezeit beim Verbindungsaufbau zum Server
    timeout check   2s              # max. Wartezeit auf die Antwort eines Health-Checks
    timeout client  50s             # Inaktivität auf der Seite des Browsers
    timeout server  50s             # Inaktivität auf der Seite des Servers

# Eingang: Hier kommen die Anfragen an (über nginx oder direkt)
frontend classroom_front
    bind 0.0.0.0:80
    default_backend classroom_backend

# Server-Pool
backend classroom_backend
    # Verteilung: Der Reihe nach, jeder Server ist abwechselnd dran.
    balance roundrobin

    # Fehlerbehandlung bei einem Request:
    # Verbindung fehlgeschlagen -> bis zu 2 Wiederholungen, mit "redispatch" auch
    # auf einem anderen Server. So merkt der Nutzer den Ausfall oft nur als Verzögerung.
    # Hinweis: Wiederholt werden nur Verbindungsfehler, bei POST ist Vorsicht geboten (Idempotenz).
    retries 2
    option redispatch

    # Health-Check: HAProxy fragt aktiv nach, ob ein Server lebt.
    # /health ist ein eigener Endpunkt, der nur "ok" meldet (Antwort 200 = gesund).
    option httpchk GET /health

    # Echte Client-IP als Header X-Forwarded-For an die App weitergeben
    option forwardfor

    # Erkennungszeit eines Ausfalls:
    #   inter 2s -> alle 2 s ein Check
    #   fall 2   -> nach 2 Fehlschlägen in Folge gilt der Server als DOWN (ca. 4 s)
    #   rise 2   -> nach 2 Erfolgen in Folge gilt er wieder als UP
    # Kleine Werte = schnelle Erkennung, aber mehr Last und Gefahr von Fehlalarmen.
    # Große Werte = ruhiger, aber längere Störung für die Nutzer.
    # on-marked-down shutdown-sessions: Bestehende Verbindungen zum ausgefallenen Server
    # werden sofort beendet, der Client baut dann eine neue zu einem gesunden Server auf.
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions

    # Beide Server sind gleichberechtigt. "check" aktiviert den Health-Check.
    # Port 30080 ist der NodePort von Kubernetes. Mit externalTrafficPolicy: Local
    # antwortet er nur, wenn auf dem Node ein bereiter Pod läuft.
    server k3s-node-a 172.16.222.161:30080 check
    server k3s-node-b 172.16.222.162:30080 check

# Dashboard: Live-Ansicht von Status, Health-Checks und Lastverteilung
# (hier ohne Login, nur für das Testnetz geeignet)
frontend stats
    bind *:8404
    stats enable
    stats uri /loadbalancer-stats   # muss mit dem Pfad im nginx übereinstimmen
    stats refresh 2s                # nur das Neuladen der Seite, unabhängig von den Health-Checks